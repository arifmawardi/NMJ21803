<!DOCTYPE html>
<html lang="en">
<head>

    <title>Physics Study: Electric Fields</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-sidebar {
            background: #0f172a;
            color: #94a3b8;
        }

        .nav-link {
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .nav-link.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        /* Modern iframe styling */
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Modern Glass Sidebar -->
    <nav id="sidebar" class="w-72 glass-sidebar flex flex-col p-6 h-full shrink-0 shadow-2xl z-10">

            <a href="page1.html" target="content-frame" class="nav-link active flex items-center gap-3 p-3 rounded-xl font-medium" onclick="setActive(this)">

            <a href="atomic polarization.html" target="content-frame" class="nav-link flex items-center gap-3 p-3 rounded-xl font-medium" onclick="setActive(this)">

                Atomic Polarization

    <!-- Main Content Area -->
    <main class="flex-grow overflow-hidden relative bg-white">
        <!-- The iframe loads original file references -->
        <iframe name="content-frame" id="content-frame" src="page1.html"></iframe>
    </main>

    <script>
        /**
         * Logic to highlight the active link in the modern sidebar
         * while allowing the iframe to handle the navigation
         */
        function setActive(element) {
            const links = document.querySelectorAll('.nav-link');
            links.forEach(l => l.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
