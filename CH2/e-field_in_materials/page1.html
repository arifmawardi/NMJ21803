<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a273a; /* Matches the dark blue in the image */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .hero-container {
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            position: relative;
        }

        .title {
            font-size: 4.5rem; /* Large, bold as seen in image */
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 48px;
            letter-spacing: -0.02em;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.03); /* Subtle glassmorphism background */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden; /* Clips the image to the rounded corners */
            transition: all 0.3s ease;
        }

        .illustration-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image fills the 16:9 box nicely */
        }

        /* The subtle decorative circle in the top right */
        .deco-circle {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 120px;
            height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Decorative Circle from Image -->
        <div class="deco-circle"></div>

        <h1 class="title">
            Electric fields in<br>materials
        </h1>

        <div class="image-container">
            <!-- Replaced placeholder content with the actual image -->
            <img src="./material.png" alt="Electric Fields Illustration" class="illustration-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center h-full gap-4\'><svg style=\'color:rgba(255,255,255,0.15)\' xmlns=\'http://www.w3.org/2000/svg\' width=\'48\' height=\'48\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'1.5\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\' ry=\'2\'/><circle cx=\'9\' cy=\'9\' r=\'2\'/><path d=\'m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\'/></svg><span style=\'color:rgba(255,255,255,0.4)\'>image.png not found</span></div>';">
        </div>
    </div>

</body>
</html>
